<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العالم الحديث</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #38bdf8;
            max-width: 90%;
            width: 420px;
        }
        h1 { color: #38bdf8; font-size: 22px; margin-bottom: 15px; line-height: 1.5; }
        p { color: #94a3b8; font-size: 16px; margin-top: 15px; }
        input[type="text"] {
            width: 80%; padding: 12px; margin-top: 15px; border-radius: 8px;
            border: 1px solid #38bdf8; background: #0f172a; color: #fff;
            text-align: center; font-size: 16px; outline: none;
        }
        button {
            margin-top: 15px; padding: 12px 25px; border-radius: 8px;
            border: none; background: #38bdf8; color: #0f172a;
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #0284c7; color: #fff; }
        .share-btn {
            background: #10b981;
            color: #fff;
            margin-top: 15px;
            width: 100%;
        }
        .share-btn:hover { background: #059669; }
        .note { font-size: 14px; color: #38bdf8; margin-top: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        {% if not name %}
            <!-- المرحلة الأولى: إدخال الاسم بدافع الفضول -->
            <h1>بوابة العالم الحديث</h1>
            <p>أدخل اسمك لفتح الرسالة الخاصة الموجهة إليك:</p>
            <form method="POST">
                <input type="text" name="user_name" placeholder="اكتب اسمك هنا..." required autofocus>
                <br>
                <button type="submit">كشف الرسالة</button>
            </form>
        {% else %}
            <!-- المرحلة الثانية: الرسالة الرسمية وزر الانتشار الفيروسي فقط -->
            <h1>مرحباً بك يا {{ name }} في العالم الحديث</h1>
            <p>⏳ انتظر الرسالة القادمة...</p>

            <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">

            <p style="font-size: 14px; color: #cbd5e1;">هل تريد أن يعرف صديقك رسالته أيضاً؟</p>
            <button class="share-btn" onclick="shareLink()">مشاركة الرابط لصديق</button>
            <div class="note" id="copy-msg"></div>
        {% endif %}
    </div>

    <script>
        function shareLink() {
            const currentUrl = window.location.href.split('?')[0];

            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = currentUrl;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            document.getElementById('copy-msg').innerText = '✅ تم نسخ الرابط بنجاح! أرسله لصديقك الآن.';
        }
    </script>
</body>
</html>
